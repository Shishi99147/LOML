<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 💕</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffcce0,#ffe6f0,#fff5f8);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.card{
    width:320px;
    background:white;
    border-radius:30px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(255,105,180,0.2);
    animation:fade 1.2s;
}

.text{
    color:soft;
    line-heightt:1.9;
    margin-top:15px;
    font-size:20px;

}

.gif{
    width:200px;
    border-radius:20px;
    margin-top:15px;
}

.kiss{
    font-size:28px;
    margin-top:10px;
    animation:pulse 1.5s infinite;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
}

</style>
</head>

<body>
